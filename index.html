<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢RIKYU MENU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="openingScreen" class="opening-screen">
    <img src="images/rikyu_logo.png" alt="夢RIKYU" class="opening-logo">
  </section>

  <header id="mainHeader" class="hidden">
    <h1>夢RIKYU MENU</h1>
    <p>Select Menu</p>
  </header>

  <main id="mainContent" class="hidden">

    <!-- メインメニュー -->
    <section id="mainMenuScreen" class="menu-screen">
      <button onclick="showDrinkCategories()">DRINK MENU</button>

      <!-- ここだけ変更 -->
      <button onclick="showSetMenu()">SET MENU</button>

      <button onclick="showFoodMenu()">FOOD MENU</button>
    </section>

    <!-- ドリンクカテゴリ -->
    <section id="drinkCategoryScreen" class="menu-screen hidden">
      <button class="back-btn" onclick="showMainMenu()">← BACK</button>

      <button onclick="showMenu('champagne')">CHAMPAGNE</button>
      <button onclick="showMenu('whisky')">WHISKY</button>
      <button onclick="showMenu('wine')">WINE</button>
      <button onclick="showMenu('shochu')">SHOCHU</button>
      <button onclick="showMenu('shot')">SHOT DRINK</button>
    </section>

    <!-- MENUアニメーション -->
    <section id="menuOpeningScreen" class="menu-opening-screen hidden">
      <h1 id="menuOpeningTitle"></h1>
    </section>

    <!-- 一覧表示 -->
    <section id="listScreen" class="list-screen hidden">

      <!-- 戻るボタン -->
      <button class="back-btn" onclick="showMainMenu()">← BACK</button>

      <h2 id="categoryTitle"></h2>

      <div id="menuList"></div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
