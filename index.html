<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>夢RIKYU MENU</title>

  <!-- キャッシュ対策 -->
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <!-- 最初のロゴ画面 -->
  <section id="openingScreen" class="opening-screen">
    <div class="logo-wrap">

      <img
        src="images/rikyu_logo.png"
        alt="夢RIKYU"
        class="opening-logo"
      >

      <div class="dream-mask"></div>
      <div class="logo-shine"></div>

    </div>
  </section>

  <!-- ヘッダー -->
  <header id="mainHeader" class="hidden">
    <h1>夢RIKYU MENU</h1>
    <p>Select Menu</p>
  </header>

  <main id="mainContent" class="hidden">

    <!-- メインメニュー -->
    <section id="mainMenuScreen" class="menu-screen">

      <button type="button" onclick="showDrinkCategories()">
        DRINK MENU
      </button>

      <button type="button" onclick="showSetMenu()">
        SET MENU
      </button>

      <button type="button" onclick="showFoodMenu()">
        FOOD MENU
      </button>

      <!-- カード・利用案内 -->
      <section class="top-information">

        <!-- 利用可能カード -->
        <div class="payment-info">

          <h2>各種カードご利用いただけます</h2>

          <div class="card-logos">

            <img
              src="images/visa.png"
              alt="VISA"
              loading="lazy"
            >

            <img
              src="images/mufg-card.png"
              alt="MUFG CARD"
              loading="lazy"
            >

            <img
              src="images/ufj.png"
              alt="UFJ"
              loading="lazy"
            >

            <img
              src="images/nicos.png"
              alt="NICOS"
              loading="lazy"
            >

            <img
              src="images/master-card.png"
              alt="Mastercard"
              loading="lazy"
            >

            <img
              src="images/jcb.png"
              alt="JCB"
              loading="lazy"
            >

          </div>
        </div>

        <!-- 禁止事項 -->
        <div class="usage-guide">

          <h2>ご利用案内</h2>

          <p>
            ※ ボトル類の持ち込みは禁止させていただきます。
          </p>

          <p>
            ※ 店内での写真・動画撮影は禁止させていただきます。
          </p>

          <p>
            ※ おさわり等の迷惑行為は禁止させていただきます。
          </p>

        </div>

      </section>

    </section>

    <!-- ドリンクカテゴリ -->
    <section id="drinkCategoryScreen" class="menu-screen hidden">

      <!-- MAIN MENUへ戻る -->
      <button
        type="button"
        class="back-btn"
        onclick="showMainMenu()"
      >
        ← BACK
      </button>

      <button type="button" onclick="showMenu('champagne')">
        CHAMPAGNE
      </button>

      <button type="button" onclick="showMenu('whisky')">
        WHISKY
      </button>

      <button type="button" onclick="showMenu('bourbon')">
        BOURBON
      </button>

      <button type="button" onclick="showMenu('brandy')">
        BRANDY
      </button>

      <button type="button" onclick="showMenu('wine')">
        WINE
      </button>

      <button type="button" onclick="showMenu('shochu')">
        焼酎
      </button>

      <button type="button" onclick="showMenu('sake')">
        日本酒
      </button>

      <button type="button" onclick="showMenu('shot')">
        SHOT DRINK
      </button>

    </section>

    <!-- カテゴリ切替アニメーション -->
    <section
      id="menuOpeningScreen"
      class="menu-opening-screen hidden"
    >
      <h1 id="menuOpeningTitle"></h1>
    </section>

    <!-- 商品・料金・フード一覧 -->
    <section id="listScreen" class="list-screen hidden">

      <!-- 遷移元によって戻り先を変更 -->
      <button
        type="button"
        class="back-btn"
        onclick="goBackFromList()"
      >
        ← BACK
      </button>

      <h2 id="categoryTitle"></h2>

      <div id="menuList"></div>

    </section>

  </main>

  <!-- キャッシュ対策 -->
  <script src="script.js?v=4"></script>

</body>
</html>
